<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 320" role="img" aria-label="JCI Oki">

  <!-- JCI テキスト：Impact フォント（最もJCIロゴに近い太字コンデンスド書体） -->
  <text x="2" y="200"
    font-family="Impact, 'Arial Narrow', Arial, sans-serif"
    font-size="205" fill="#009FDA">JCI</text>

  <!-- シールド内部のクリップパス -->
  <defs>
    <clipPath id="shield-clip">
      <path d="M360 16 Q360 6 370 6 L458 6 Q468 6 468 16 L468 130
               Q468 174 413 196 Q358 174 358 130 Z"/>
    </clipPath>
  </defs>

  <!-- シールド背景（白） -->
  <path d="M360 16 Q360 6 370 6 L458 6 Q468 6 468 16 L468 130
           Q468 174 413 196 Q358 174 358 130 Z"
    fill="white"/>

  <!-- 地球儀：シールド内にクリップ -->
  <g clip-path="url(#shield-clip)">
    <!-- 同心円（外→内） -->
    <circle cx="413" cy="100" r="76" fill="none" stroke="#009FDA" stroke-width="6"/>
    <circle cx="413" cy="100" r="66" fill="none" stroke="#009FDA" stroke-width="5"/>
    <circle cx="413" cy="100" r="55" fill="none" stroke="#009FDA" stroke-width="4.5"/>
    <circle cx="413" cy="100" r="44" fill="none" stroke="#009FDA" stroke-width="4"/>
    <circle cx="413" cy="100" r="33" fill="none" stroke="#009FDA" stroke-width="4"/>
    <circle cx="413" cy="100" r="22" fill="none" stroke="#009FDA" stroke-width="3.5"/>
    <circle cx="413" cy="100" r="11" fill="none" stroke="#009FDA" stroke-width="3.5"/>
    <!-- 水平・垂直の十字線 -->
    <line x1="330" y1="100" x2="496" y2="100" stroke="#009FDA" stroke-width="5.5"/>
    <line x1="413" y1="17"  x2="413" y2="183" stroke="#009FDA" stroke-width="5.5"/>
    <!-- 斜め45度の対角線 -->
    <line x1="359" y1="46" x2="467" y2="154" stroke="#009FDA" stroke-width="4"/>
    <line x1="467" y1="46" x2="359" y2="154" stroke="#009FDA" stroke-width="4"/>
  </g>

  <!-- シールド枠線（クリップ内容の上に描画してエッジをクリーンに） -->
  <path d="M360 16 Q360 6 370 6 L458 6 Q468 6 468 16 L468 130
           Q468 174 413 196 Q358 174 358 130 Z"
    fill="none" stroke="#009FDA" stroke-width="13" stroke-linejoin="round"/>

  <!-- TM マーク -->
  <text x="474" y="26"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="18" font-weight="700" fill="#009FDA">TM</text>

  <!-- Oki テキスト（JCI と同書体） -->
  <text x="260" y="295"
    font-family="Impact, 'Arial Narrow', Arial, sans-serif"
    font-size="78" fill="#009FDA"
    text-anchor="middle" letter-spacing="6">Oki</text>

</svg>
